<svg width="1300" height="750" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1300" height="750" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="650" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Survey Branching Flow: Home Remodeling Survey</text>
  
  <!-- Default Group (Group 0) -->
  <rect x="50" y="60" width="400" height="640" fill="#e0e0e0" stroke="#999" stroke-width="3" rx="8"/>
  <text x="250" y="85" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Group 0 (Default) - Shown to All</text>
  
  <!-- Q1 -->
  <rect x="70" y="110" width="360" height="70" fill="#fff" stroke="#666" stroke-width="2" rx="5"/>
  <text x="250" y="133" font-size="13" text-anchor="middle" fill="#000">Q1: The remodeling project was completed</text>
  <text x="250" y="150" font-size="13" text-anchor="middle" fill="#000">within the originally agreed timeline.</text>
  <text x="250" y="167" font-size="11" font-style="italic" text-anchor="middle" fill="#666">(True/False)</text>
  
  <!-- Q2 -->
  <rect x="70" y="195" width="360" height="70" fill="#fff" stroke="#666" stroke-width="2" rx="5"/>
  <text x="250" y="218" font-size="13" text-anchor="middle" fill="#000">Q2: The project team communicated clearly</text>
  <text x="250" y="235" font-size="13" text-anchor="middle" fill="#000">and kept me informed throughout.</text>
  <text x="250" y="252" font-size="11" font-style="italic" text-anchor="middle" fill="#666">(True/False)</text>
  
  <!-- Q3 -->
  <rect x="70" y="280" width="360" height="70" fill="#fff" stroke="#666" stroke-width="2" rx="5"/>
  <text x="250" y="303" font-size="13" text-anchor="middle" fill="#000">Q3: How clear were the written plans</text>
  <text x="250" y="320" font-size="13" text-anchor="middle" fill="#000">and timelines provided for the project?</text>
  <text x="250" y="337" font-size="11" font-style="italic" text-anchor="middle" fill="#666">(Rating 1-10)</text>
  
  <!-- Q4 with branching options -->
  <rect x="70" y="365" width="360" height="90" fill="#fff" stroke="#666" stroke-width="3" rx="5"/>
  <text x="250" y="385" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Q4: Which areas of your home were included</text>
  <text x="250" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">in this remodel? (select all that apply)</text>
  <rect x="90" y="415" width="130" height="25" fill="#4287f5" stroke="#2a5f9e" stroke-width="1" rx="3"/>
  <text x="155" y="433" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Kitchen → Group 1</text>
  <rect x="240" y="415" width="150" height="25" fill="#9b59b6" stroke="#6d3f8c" stroke-width="1" rx="3"/>
  <text x="315" y="433" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Bathroom → Group 2</text>
  
  <!-- Q7 -->
  <rect x="70" y="470" width="360" height="70" fill="#fff" stroke="#666" stroke-width="2" rx="5"/>
  <text x="250" y="493" font-size="13" text-anchor="middle" fill="#000">Q7: How would you rate the value for money</text>
  <text x="250" y="510" font-size="13" text-anchor="middle" fill="#000">of the remodeling project?</text>
  <text x="250" y="527" font-size="11" font-style="italic" text-anchor="middle" fill="#666">(Rating 1-10)</text>
  
  <!-- Q8 - Last Question -->
  <rect x="70" y="555" width="360" height="70" fill="#ffffcc" stroke="#ffc107" stroke-width="3" rx="5"/>
  <text x="250" y="578" font-size="13" font-weight="bold" text-anchor="middle" fill="#000">Q8: Do you have anything to add?</text>
  <text x="250" y="595" font-size="11" text-anchor="middle" fill="#666">(Free text)</text>
  <text x="250" y="612" font-size="11" font-style="italic" font-weight="bold" text-anchor="middle" fill="#f57c00">LAST QUESTION - Shown at end to all</text>
  
  <!-- Kitchen Group -->
  <rect x="480" y="60" width="380" height="180" fill="#b3d9ff" stroke="#4287f5" stroke-width="3" rx="8"/>
  <text x="670" y="85" font-size="18" font-weight="bold" text-anchor="middle" fill="#003d7a">Group 1: Kitchen</text>
  <text x="670" y="105" font-size="12" font-style="italic" text-anchor="middle" fill="#0055a5">Cued if "Kitchen" selected in Q4</text>
  
  <rect x="500" y="125" width="340" height="90" fill="#fff" stroke="#4287f5" stroke-width="2" rx="5"/>
  <text x="670" y="148" font-size="13" text-anchor="middle" fill="#000">Q5: What did you have done in the kitchen?</text>
  <text x="670" y="165" font-size="11" text-anchor="middle" fill="#666">□ New cabinets</text>
  <text x="670" y="182" font-size="11" text-anchor="middle" fill="#666">□ New appliances</text>
  <text x="670" y="199" font-size="11" text-anchor="middle" fill="#666">□ Flooring</text>
  
  <!-- Arrow from Q4 Kitchen to Kitchen Group -->
  <path d="M 430 430 L 480 155" stroke="#4287f5" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="440" y="290" font-size="11" font-weight="bold" fill="#4287f5">If Kitchen</text>
  <text x="440" y="304" font-size="11" font-weight="bold" fill="#4287f5">selected</text>
  
  <!-- Bathroom Group -->
  <rect x="880" y="60" width="380" height="180" fill="#e6d5f0" stroke="#9b59b6" stroke-width="3" rx="8"/>
  <text x="1070" y="85" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a235a">Group 2: Bathroom</text>
  <text x="1070" y="105" font-size="12" font-style="italic" text-anchor="middle" fill="#6d3f8c">Cued if "Bathroom" selected in Q4</text>
  
  <rect x="900" y="125" width="340" height="90" fill="#fff" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="1070" y="148" font-size="13" text-anchor="middle" fill="#000">Q6: What did you have done in the Bathroom?</text>
  <text x="1070" y="165" font-size="11" text-anchor="middle" fill="#666">□ New fixtures</text>
  <text x="1070" y="182" font-size="11" text-anchor="middle" fill="#666">□ Tile work</text>
  <text x="1070" y="199" font-size="11" text-anchor="middle" fill="#666">□ Vanity</text>
  
  <!-- Arrow from Q4 Bathroom to Bathroom Group -->
  <path d="M 430 430 L 880 155" stroke="#9b59b6" stroke-width="3" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="650" y="290" font-size="11" font-weight="bold" fill="#9b59b6">If Bathroom</text>
  <text x="650" y="304" font-size="11" font-weight="bold" fill="#9b59b6">selected</text>
  
  <!-- Flow Explanation Box -->
  <rect x="480" y="270" width="780" height="190" fill="#fff" stroke="#333" stroke-width="2" rx="8"/>
  <text x="870" y="295" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Survey Flow Sequence</text>
  
  <text x="500" y="325" font-size="13" fill="#333">1. All respondents start with Group 0 questions (Q1, Q2, Q3, Q4, Q7)</text>
  <text x="520" y="345" font-size="12" font-style="italic" fill="#666">Note: Q8 is marked as "Last Question" so it's skipped for now</text>
  
  <text x="500" y="370" font-size="13" fill="#333">2. Based on Q4 answer, groups are "cued":</text>
  <text x="520" y="388" font-size="12" fill="#4287f5">• If "Kitchen" selected → Group 1 (Kitchen) is cued</text>
  <text x="520" y="404" font-size="12" fill="#9b59b6">• If "Bathroom" selected → Group 2 (Bathroom) is cued</text>
  <text x="520" y="420" font-size="12" fill="#2e7d32">• If both selected → Both groups are cued</text>
  
  <text x="500" y="445" font-size="13" fill="#333">3. After Group 0 complete, cued groups are shown in order (Group 1, then Group 2)</text>
  
  <!-- Final note about Last Question -->
  <rect x="480" y="475" width="780" height="60" fill="#ffffee" stroke="#ffc107" stroke-width="2" rx="8"/>
  <text x="870" y="500" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">4. Finally, Q8 (Last Question) is shown to ALL respondents</text>
  <text x="870" y="520" font-size="12" text-anchor="middle" fill="#666">Then the respondent can submit the survey</text>
  
  <!-- Legend -->
  <text x="50" y="720" font-size="14" font-weight="bold" fill="#333">Key:</text>
  <rect x="110" y="708" width="20" height="15" fill="#e0e0e0" stroke="#999" stroke-width="1"/>
  <text x="135" y="720" font-size="11" fill="#333">Group 0 (Default)</text>
  
  <rect x="260" y="708" width="20" height="15" fill="#b3d9ff" stroke="#4287f5" stroke-width="1"/>
  <text x="285" y="720" font-size="11" fill="#333">Kitchen (Conditional)</text>
  
  <rect x="420" y="708" width="20" height="15" fill="#e6d5f0" stroke="#9b59b6" stroke-width="1"/>
  <text x="445" y="720" font-size="11" fill="#333">Bathroom (Conditional)</text>
  
  <rect x="590" y="708" width="20" height="15" fill="#ffffcc" stroke="#ffc107" stroke-width="1"/>
  <text x="615" y="720" font-size="11" fill="#333">Last Question</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#4287f5"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#9b59b6"/>
    </marker>
  </defs>
</svg>
